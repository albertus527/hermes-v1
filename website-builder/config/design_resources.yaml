# Website Builder — Design Resource Manifest (Batch D0.1)
#
# ONE authoritative declaration of which design resources the builder is
# configured to use and how each one is resolved. This file is the single
# source of truth for design-resource configuration: no resource path, skill
# name, or install mode is spelled anywhere else in the application.
#
# What this file is NOT:
#   * It is not an inventory of what happens to be installed. `required` and
#     `install_mode` declare INTENT; availability is proven separately by
#     app/core/design_capabilities.py inspecting the resolved profile.
#   * It is not an install list. Nothing here causes an install, a clone, or a
#     network fetch. Batch D0.1-D0.2 provisions nothing.
#   * It is not read by FRONTEND. Design DNA behavior and prompts are unchanged
#     by this batch; this is capability plumbing and preflight wiring only.
#
# Schema (validated fail-closed by app/core/design_resources.py):
#   version          int, currently 1
#   data_entries_max int, bounds each resource's data_entries list
#   resources        mapping of <resource_id> -> resource declaration
#     kind           skill | reference | registry | npm_optional  (closed set)
#     required       bool
#     resolution     profile_skill | on_demand_registry | deferred
#                    (closed set)
#     skill_name     str, REQUIRED iff kind == skill
#     install_mode   project_on_demand, permitted iff kind in
#                    (registry, npm_optional)
#     adapter        str, the retrieval adapter this resource is reached
#                    through. An adapter named here MUST exist in
#                    design_retrieval._RESOURCE_ADAPTER_IDS -- a resource
#                    claiming an adapter nobody registered is exactly the
#                    placeholder this batch removes.
#     data_entries   list of skill-root-relative paths. Each must be relative,
#                    free of ".." under either separator, and must resolve
#                    INSIDE the skill directory (symlinks included).
#
# `deferred` is reserved for resources that are declared but NOT wired. Every
# resource below that D3a.5 actually operates carries `profile_skill` or
# `on_demand_registry` instead; tests/test_design_resources.py fails closed if
# an adapter is claimed and not registered, or if an implemented resource is
# still marked deferred.
#
# Two resources are deliberately required=false at this stage: making them
# required would block startup on a host that has never been provisioned with
# them, which is a regression, not a safety property. Only ui_ux_pro_max is
# load-bearing for R1.

version: 1

# Bounds each resource's data_entries list. A manifest that pins hundreds of
# files is a snapshot of a directory listing, not a capability contract, and it
# would make the existence check unbounded work on every startup.
data_entries_max: 32

resources:

  # --- Skills resolved from the Website profile's skills directory -----------
  #
  # Resolution is profile-local ($HERMES_HOME/skills/<skill_name>), which is
  # how Hermes discovers skills regardless of cwd. The profile home is
  # supplied by RuntimeConfig.hermes_home -- never a hardcoded user path.

  ui_ux_pro_max:
    kind: skill
    required: true
    resolution: profile_skill
    skill_name: ui-ux-pro-max
    adapter: guidance
    # The two canonical artifacts, verified against the real profile layout:
    # one search entrypoint and one core dataset. A skill whose only verified
    # artifact is SKILL.md is a placeholder directory -- precisely the case
    # this manifest exists to distinguish from a usable capability. The full
    # UI UX Pro Max data set is intentionally NOT pinned; these two are the
    # D0.2 floor. Availability here means the local layout is statically
    # verified -- it does NOT mean the search command has been executed.
    data_entries:
      - scripts/search.py
      - data/styles.csv


  impeccable:
    kind: skill
    required: false
    resolution: profile_skill
    skill_name: impeccable
    # Impeccable has TWO surfaces, and `adapter` names only the retrieval one:
    #
    #   * RETRIEVAL -- `critic`, the SKILL.md adapter that feeds Impeccable's
    #     critique guidance into a prompt. That is what this field means.
    #   * CRITIC SCAN -- `design_critic.run_critic_scan`, the bounded
    #     `detect --json --quiet` invocation against the platform engine. This
    #     is NOT a retrieval adapter: it produces CriticFinding records, not
    #     prompt text, so forcing it through `adapter` would misdescribe the
    #     field. It is verified by tests/test_design_critic.py and reported
    #     through the activation report's `critic_available` axis.
    #
    # There is NO repair path in either surface -- see design_critic's module
    # docstring.
    adapter: critic
    # VERIFIED AGAINST THE OFFICIAL RELEASE (skill-v4.1.0) on a real host.
    # pbakaus/impeccable publishes exactly ONE asset: `universal.zip`, 17,675,065
    # bytes, sha256:a54d837f086ff2036ab0cf2cc2499249362d38fa27d42feb07d6248dfdd64a11.
    # That archive has NO `scripts/bin/` directory, NO `scripts/impeccable`
    # launcher, and no per-platform native binary of any kind. The git TAG of the
    # same name is likewise source-only.
    #
    # The Hermes layout is `.hermes/skills/impeccable/`: SKILL.md, reference/*.md,
    # and `scripts/detect.mjs` -- a Node ESM entrypoint, not a native binary. It is
    # CROSS-PLATFORM and identical on every host, so the engine needs no platform
    # mapping here; `app.core.design_activation` verifies the Node engine's
    # presence, and `app.core.design_critic` runs it.
    #
    # Provisioned EXPLICITLY (setup / deploy / profile update) at an
    # application-owned version/ref with a verified artifact digest. A build never
    # clones, downloads, or updates it. An absent skill is `unavailable_optional`
    # -- a degraded status that is never a startup failure.
    #
    # PARSER RUNTIME (Part H). The universal artifact ships NO `package.json`,
    # so the detector's full static HTML/CSS engine is only available when four
    # npm parser modules are provisioned into the skill's own `node_modules`
    # (`htmlparser2 12.0.0`, `css-select 7.0.0`, `css-tree 3.2.1`,
    # `domutils 4.0.2` -- the upstream skill-v4.1.0 `package.json` pins,
    # application-owned in `design_install.IMPECCABLE_PARSER_PACKAGE_PINS`).
    # They are provisioned ONLY during explicit profile setup, NEVER during a
    # website build. Without them the engine prints
    # `DEGRADED - HTML parser modules unavailable` and regex-falls-back; the
    # capability report then sets `critic_degraded=True` and `authoritative=False`
    # so a degraded clean scan is never treated as a pass.
    data_entries:
      - SKILL.md
      - reference/critique.md
      - reference/audit.md
      - scripts/detect.mjs
  refero:
    kind: skill
    required: false
    resolution: profile_skill
    skill_name: refero-design
    adapter: reference_markdown
    # Provisioned EXPLICITLY (setup / deploy / profile update), never cloned
    # during a project build. The canonical upstream skill lives at
    # skills/refero-design/ in referodesign/refero_skill (VERSION 1.0.2) and
    # ships SKILL.md plus eleven references/*.md and agents/openai.yaml.
    #
    # The WHOLE directory is required, not SKILL.md alone: the reference files
    # ARE the craft guidance, and a skill whose only verified artifact is
    # SKILL.md is exactly the placeholder directory this manifest exists to
    # distinguish from a usable capability.
    #
    # These entries are cross-platform and OS-agnostic. Nothing here names a
    # platform, and no live-MCP host appears: the paid MCP tier is an optional
    # enhancement that must never gate the free local baseline.
    data_entries:
      - SKILL.md
      - references/typography.md
      - references/color.md
      - references/motion.md
      - references/craft-details.md
      - references/anti-ai-slop.md
  twenty_first:
    kind: reference
    required: false
    # D3a.5: metadata SEARCH is real and works with no credential (the free
    # tier), while component RETRIEVAL needs an account. The activation report
    # carries both axes separately -- discovery_available vs retrieval_available
    # -- so the resource is no longer a single boolean that must lie about one
    # of them.
    resolution: on_demand_registry
    adapter: twenty_first

  react_bits:
    kind: reference
    required: false
    # D3a.5: components install through the pinned shadcn CLI from
    # reactbits.dev, using React Bits' published llms.txt as the catalog.
    resolution: on_demand_registry
    adapter: react_bits

  transitions_dev:
    kind: reference
    required: false
    # D3a.5: recipes materialize through the pinned transitions-dev CLI, one
    # catalog-listed slug at a time, into ./transitions/ inside the project.
    # Only the free tier is reachable; `add --pro` opens a browser sign-in.
    resolution: on_demand_registry
    adapter: transitions_dev

  # --- Provisioned per project, on demand ------------------------------------
  #
  # These are NOT global dependencies. Nothing is installed at bootstrap; each
  # is added to an individual project when and if that project's design calls
  # for it. Their absence is therefore the correct resting state and reports
  # `not_installed` -- NOT `unavailable_optional`. Reporting a permanent
  # degradation that nobody can act on is a field operators learn to ignore.
  #
  # `not_installed` is keyed off this `install_mode` declaration, so the
  # registry resource (shadcn) reports it exactly as the npm_optional ones do.

  shadcn:
    kind: registry
    required: false
    # D3a.5: components install through the shadcn CLI at an EXACT pinned
    # version, through the typed registry boundary in design_registry.py.
    resolution: on_demand_registry
    install_mode: project_on_demand
    adapter: shadcn

  gsap:
    kind: npm_optional
    required: false
    resolution: on_demand_registry
    install_mode: project_on_demand
    adapter: npm_package

  three:
    kind: npm_optional
    required: false
    resolution: on_demand_registry
    install_mode: project_on_demand
    adapter: npm_package
    # `three` pulls a COMPANION package -- @types/three -- which is what makes
    # the TypeScript build actually compile (TS7016 without it). The companion
    # is an CLOSED entry in design_install.DEPENDENCY_COMPANION_PACKAGES, not
    # a generic `@types/<pkg>` derivation: a generic rule would invent a
    # types-package for every dependency ever added.
    companion: three

  lenis:
    kind: npm_optional
    required: false
    resolution: on_demand_registry
    install_mode: project_on_demand
    adapter: npm_package
