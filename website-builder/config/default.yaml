# Website Builder R1 Configuration
# Non-secret settings only. Secrets go in .env.

website_builder:
  # Phase 15: WhatsApp Cloud API channel (official Meta Business Platform
  # only). Disabled by default -- enabling requires real Meta credentials
  # in .env (WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID,
  # WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET) and webhook registration.
  # See app/channels/whatsapp.py for the full contract.
  whatsapp:
    enabled: false
    # Configurable Meta Graph API version. Never hardcode a stale version;
    # set this once real credentials/webhooks are configured.
    graph_api_version: null

  # D4a: OpenViking context-retrieval foundation. A bounded, READ-ONLY context
  # provider for a future Laya context pack. It is NOT an authority: it cannot
  # make requirements decisions, install dependencies, override Design DNA,
  # mutate project state, or execute anything.
  #
  # DISABLED BY DEFAULT. When disabled the retrieval adapter is a no-op: it
  # contacts no backend, invents no context, and changes no existing behaviour
  # (Design DNA retrieval is unaffected). Enable only after a real OpenViking
  # server has been provisioned and LIVE-QUALIFIED -- see
  # docs/D4A_OPENVIKING_FOUNDATION_ACCEPTANCE.md. D4a qualified the adapter
  # against a deterministic offline backend only, so live ingestion is NOT yet
  # qualified and the live write path refuses to run.
  #
  # ``base_url`` defaults to a LOCALHOST endpoint. The service must never be
  # exposed publicly; bind it to localhost and, where supported, require an API
  # key. The API key is read from the ``OPENVIKING_API_KEY`` environment
  # variable, NEVER from this file.
  #
  # AUTH (verified live, D4a.1): OpenViking's api_key mode is TWO-LAYER. The root
  # key (in ov.conf) can ONLY administer; tenant DATA APIs (search/find,
  # resources, fs, content) require an account USER key. ``OPENVIKING_API_KEY``
  # must therefore hold the USER key (provisioned by tools/openviking_provision.sh),
  # not the root key.
  openviking:
    enabled: false
    base_url: 'http://localhost:1933'
    # Request timeout (seconds) and bounded retries AFTER the first attempt.
    timeout_seconds: 10
    max_retries: 1
    # The exact OpenViking release this batch was reviewed against. Recorded for
    # provenance; nothing here installs or upgrades it.
    pinned_version: '0.4.23'

  # Workspace root for generated projects
  workspace_root: '~/website-workspaces'

  # Website Hermes profile home
  hermes_home: '~/.hermes-website'

  # MAX_WORKERS=1 — one active project mutation at a time
  max_workers: 1

  # Fixed frontend starter path (relative to repo root)
  frontend_starter: 'templates/frontend-starter'

  # Domain discovery
  domain:
    # Provider name — must be configured externally
    provider: null
    # Bounded candidate set size
    max_candidates: 5
    max_alternatives: 3

  # Message debounce
  intake:
    debounce_seconds: 2.0

  # LIVE source publication (R1).
  #
  # After a publish is successfully promoted, production smoke-verified and
  # marked LIVE, the EXACT tested snapshot commit of that revision is pushed
  # to a friendly per-project branch in this repository. The branch is the
  # project's human-readable publication history: one commit per LIVE
  # revision, each holding the tested snapshot's exact tree, advanced by a
  # normal fast-forward push and never force-moved.
  #
  # R1 writes only. Nothing is ever read back from this repository, no source
  # is hydrated from it, and revision behavior does not depend on it.
  #
  # deploy_key_path points at the VPS deploy key for this repository. The key
  # itself is never read, copied, or logged by the application: it is handed
  # to git as GIT_SSH_COMMAND and used for that one push. Leave it null to
  # disable publication (nothing is attempted and nothing is reported as
  # unsynced).
  github:
    enabled: true
    repo: 'git@github.com:albertus527/website.git'
    deploy_key_path: null

  # Build
  build:
    timeout_seconds: 300

  # FRONTEND supervision (app/hermes/watchdog.py).
  #
  # A FRONTEND invocation is supervised by an activity-aware watchdog, not a
  # fixed wall-clock timeout. The supervisor terminates an invocation only when
  # that EXACT invocation stops making progress (idle) or hits an independent
  # hard ceiling (pathological run). Activity from any other project or build
  # can never refresh it.
  frontend_watchdog:
    # No progress for this long with nothing in flight => FRONTEND_IDLE_TIMEOUT.
    # A long provider request is NOT idle: it is an in-flight operation.
    idle_timeout_seconds: 180

    # Independent upper bound for a run that never stops making progress =>
    # FRONTEND_HARD_TIMEOUT. Pathological behaviour only, never quality control.
    hard_max_runtime_seconds: 2700

    # No-progress backstop that applies even while an operation is in flight.
    # Measured from the last progress event, so legitimate streaming keeps an
    # operation protected; only a genuinely silent operation is cut off.
    max_single_operation_seconds: 900

    # Wall-clock bound used only when the child never announces a progress
    # channel, so liveness is unknowable. Matches the pre-watchdog behaviour
    # so a degraded supervisor is never more permissive than what it replaced.
    legacy_wallclock_seconds: 900

    # The child must announce its progress channel within this grace
    # (Hermes runtime import is slow). Purely observational: a late handshake
    # degrades to legacy_wallclock_seconds, it never fails the run.
    startup_grace_seconds: 60

    # No deliverable change (design-dna.json or anything under src/) for this
    # long, WITH design-dna.json present AND src/App.tsx positively still the
    # untouched starter placeholder => FRONTEND_NO_CONVERGENCE.
    #
    # NOT a liveness bound. It reads no progress event, so model and tool
    # activity cannot refresh it — that is the point: a run that stays busy
    # while never writing its own output is exactly what this catches, and no
    # other bound covers it. Deliberately generous and matched to
    # max_single_operation_seconds; any src/ or design-dna.json change restarts
    # the window, and an implemented src/App.tsx means it can never arm.
    convergence_seconds: 900
